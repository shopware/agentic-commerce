name: Package extension zip

# Builds a downloadable, install-ready SwagAgenticCommerce.zip for a pull
# request so reviewers can test the change without a local build. This is opt-in
# per PR: it only runs while the `build:zip` label is set. Adding the label
# builds immediately; while the label stays on, every new push rebuilds the zip.
# The artifact is attached to the workflow run under the name
# "SwagAgenticCommerce.zip".

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: package-zip-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package-zip:
    name: Package extension zip
    if: contains(github.event.pull_request.labels.*.name, 'build:zip')
    runs-on: ubuntu-latest
    steps:
      - name: Build, validate and upload the extension zip
        uses: shopware/github-actions/build-zip@main
        with:
          extensionName: SwagAgenticCommerce
