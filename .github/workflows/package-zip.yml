name: Package extension zip

# Builds, validates and install-tests the SwagAgenticCommerce archive. This is the only place the
# archive is built:
#   - ci.yml calls it on every pull request, so each one leaves a downloadable, install-tested ZIP.
#   - store-release.yml calls it for a Store release and for a pre-release tag.
#   - "Run workflow" (workflow_dispatch) builds any branch or tag by hand.
#
# The artifact is uploaded UNPACKED (the SwagAgenticCommerce/ plugin directory),
# so GitHub's own artifact-download wrapper is the install-ready zip: downloading
# it yields SwagAgenticCommerce.zip containing SwagAgenticCommerce/, which uploads
# straight into Administration -> Extensions -> Upload extension. Uploading the
# built .zip as an artifact instead would double-zip it (GitHub wraps artifacts in
# another zip), and the admin would reject it with
# FRAMEWORK__PLUGIN_NO_PLUGIN_FOUND_IN_ZIP.
#
# The built .zip travels separately as SwagAgenticCommerce-archive, for the jobs that install or
# publish it, so they use the exact bytes that were validated. A browser download of that one
# arrives double-zipped; it is not meant for people.

on:
  workflow_dispatch:
    inputs:
      overwrite_version:
        description: 'Plugin version to stamp. A pre-release takes an alpha, beta or rc suffix (1.3.1-rc.1); Composer rejects any other suffix'
        required: false
        default: ''
      label_stamp:
        description: 'Note appended to the extension label, so an installed copy is not mistaken for a release'
        required: false
        default: none
        type: choice
        options:
          - none
          - prerelease
      archive_under_test:
        description: 'Release tag whose published archive the zip-install job tests instead of the build, for example 1.4.0, which has to fail on the older-packages runs'
        required: false
        default: ''
      shopware_versions:
        description: 'JSON object that sets the Shopware version of a line for the zip-install job, for example {"6.6": "6.6.10.21"}'
        required: false
        default: ''
  workflow_call:
    inputs:
      overwrite_version:
        required: false
        default: ''
        type: string
      # none, prerelease (needs overwrite_version) or pull-request (needs a pull_request event).
      label_stamp:
        required: false
        default: none
        type: string

permissions:
  contents: read

concurrency:
  # A called workflow sees the caller's context. Only a pull request's superseded runs cancel each
  # other; every other run gets its own group, so a main push or a release is never cancelled.
  group: package-zip-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  package-zip:
    name: Package extension zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # full history so shopware-cli can generate the changelog
          fetch-depth: 0

      - name: Install shopware-cli
        uses: shopware/shopware-cli-action@v3

      # The version column is easy to skim past; the label is the name the extension list leads
      # with. The next plugin refresh after a real release is installed rewrites it.
      - name: Stamp the extension label
        if: inputs.label_stamp != 'none'
        env:
          STAMP: ${{ inputs.label_stamp }}
          VERSION: ${{ inputs.overwrite_version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "${STAMP}" in
            prerelease)
              if [[ -z "${VERSION}" ]]; then
                echo "label_stamp prerelease needs overwrite_version." >&2
                exit 1
              fi
              en="pre-release ${VERSION}"
              de="Vorabversion ${VERSION}"
              ;;
            pull-request)
              if [[ -z "${PR_NUMBER}" ]]; then
                echo "label_stamp pull-request needs a pull_request event." >&2
                exit 1
              fi
              en="PR #${PR_NUMBER}"
              de="PR #${PR_NUMBER}"
              ;;
            *)
              echo "Unknown label_stamp '${STAMP}'." >&2
              exit 1
              ;;
          esac
          jq --arg en "${en}" --arg de "${de}" '
            .extra.label["en-GB"] += " (\($en))"
            | .extra.label["de-DE"] += " (\($de))"
          ' composer.json > composer.json.stamped
          mv composer.json.stamped composer.json

      # Puts the SDK into lib/ and rewrites this checkout's composer.json for the archive, so Shopware
      # registers the SDK through the plugin's own PSR-4 entries and never runs Composer for it. The
      # checkout is a throwaway of this job.
      - name: Bundle the UCP SDK into the archive
        run: bin/ci-bundle-sdk-into-archive.sh .

      - name: Build and validate the extension zip
        env:
          OVERWRITE_VERSION: ${{ inputs.overwrite_version }}
        run: |
          set -euo pipefail
          version_flag=()
          if [[ -n "${OVERWRITE_VERSION}" ]]; then
            version_flag=(--overwrite-version "${OVERWRITE_VERSION}")
          fi
          # --disable-git packs the checkout as it stands, label stamp and lib/ included, and
          # bin/ci-assert-zip-bundles-sdk.sh fails the build if anything strays in.
          shopware-cli extension zip . --disable-git --release "${version_flag[@]}"
          # shopware-cli 0.19's phpstan checker needs vendor/autoload.php inside the extension, but
          # the zip ships no vendor/ by design. PHPStan runs with the full autoloader in ci.yml.
          shopware-cli extension validate SwagAgenticCommerce.zip --exclude phpstan

      # `extension validate` does not look at the compiled administration bundle, so it
      # happily passes an archive whose admin assets are empty or self-referencing.
      - name: Assert the zip ships a usable administration bundle
        run: bin/ci-assert-zip-admin-bundle.sh SwagAgenticCommerce.zip

      # `extension validate` does not read the archive's dependency shape, so a build that lost the
      # bundled SDK, or shipped a vendor/ -- and with it a second Composer autoloader in every shop --
      # would pass it. The checkout is passed along so the schema count can be compared with the
      # bundled package.
      - name: Assert the zip bundles the SDK and no vendor/
        run: bin/ci-assert-zip-bundles-sdk.sh SwagAgenticCommerce.zip .

      - name: Unpack so the downloaded artifact is directly installable
        run: |
          mkdir -p dist
          unzip -q SwagAgenticCommerce.zip -d dist

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: SwagAgenticCommerce
          path: dist
          include-hidden-files: true
          retention-days: 14

      - name: Upload the archive for the install and publish jobs
        uses: actions/upload-artifact@v6
        with:
          name: SwagAgenticCommerce-archive
          path: SwagAgenticCommerce.zip
          retention-days: 3

      - name: How to verify this archive on a local lane
        run: |
          {
            echo "### Installing this archive on your own lane"
            echo
            echo 'The zip-install job already did this on shopware-cli shops of 6.5, 6.6, 6.7 and trunk,'
            echo 'and updated the archive from 1.3.0, 1.4.0 and the latest release. To repeat it'
            echo 'against a local lane, on a shop that does not already provide the SDK:'
            echo
            echo '```'
            echo 'bin/test-zip-install.sh --zip <downloaded>.zip \'
            echo '  --container shopware-6-5-branch-web-1 \'
            echo '  --shop-url http://sw65.localhost:8088 \'
            echo '  --sync-session agentic-commerce-65'
            echo '```'
            echo
            echo 'It strips the project-level SDK first and refuses to run if the shop can still'
            echo 'resolve it, because that is how the last defect stayed invisible. After the install'
            echo 'it checks that no Composer package outside the plugin moved, that the shop gained no'
            echo 'vendor/ucp-php-sdk and that the storefront, the Administration and /.well-known/ucp'
            echo 'answer 200, so the archive brought the SDK without a Composer run.'
            echo
            echo 'bin/ci-create-shop.sh makes the shop the job uses. Given --packages-before, it pins the'
            echo 'Symfony and Doctrine packages to the releases before that time.'
          } >> "$GITHUB_STEP_SUMMARY"

  zip-install-plan:
    name: Plan the zip install runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve the Shopware versions and download the release archives
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_UNDER_TEST: ${{ inputs.archive_under_test }}
          SHOPWARE_VERSIONS: ${{ inputs.shopware_versions }}
        run: |
          bin/ci-plan-zip-install.sh --output-dir zip-install-archives \
            --archive-under-test "${ARCHIVE_UNDER_TEST}" --shopware-versions "${SHOPWARE_VERSIONS}"

      - name: Upload the release archives
        uses: actions/upload-artifact@v6
        with:
          name: zip-install-archives
          path: zip-install-archives
          retention-days: 3

      - name: Summarise the plan
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
          ARCHIVE_UNDER_TEST: ${{ inputs.archive_under_test }}
        run: |
          {
            echo "### Zip install runs"
            echo
            echo '| Line | Packages | Shopware | PHP | Packages released before |'
            echo '| --- | --- | --- | --- | --- |'
            jq -r '.[] | "| \(.line) | \(.packages) | \(.shopware_version) | \(.php_version) | \(.packages_before) |"' <<< "${MATRIX}"
            echo
            echo "Each run installs the archive, then updates from every release archive below:"
            echo
            for base_archive in zip-install-archives/base/*.zip; do
              echo "- ${base_archive##*/SwagAgenticCommerce-}"
            done
            if [[ -n "${ARCHIVE_UNDER_TEST}" ]]; then
              echo
              echo "The archive under test is the published ${ARCHIVE_UNDER_TEST} release, not the build."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Neither the admin-bundle guard nor the SDK guard can prove the archive installs. The SDK was
  # once present, correctly pointed at, and still never loaded, because Shopware does not require
  # a plugin's own vendor/autoload.php -- so both checks passed while `plugin:install` failed on
  # every Shopware version. Only an install onto a shop that does not separately provide the SDK
  # settles it, on each supported line. The archive's own PSR-4 entries have to find the SDK, and
  # the shop's Composer files must stay as they were.
  zip-install:
    name: Install the zip (${{ matrix.line }}, ${{ matrix.packages }} packages)
    needs: [package-zip, zip-install-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.zip-install-plan.outputs.matrix) }}
    env:
      CACHE_KEY_PREFIX: zip-install-composer-${{ matrix.line }}-${{ matrix.packages }}-
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: agentic-commerce

      - name: Install shopware-cli
        uses: shopware/shopware-cli-action@v3

      - name: Download the built archive
        uses: actions/download-artifact@v7
        with:
          name: SwagAgenticCommerce-archive
          path: ${{ github.workspace }}

      - name: Download the release archives
        uses: actions/download-artifact@v7
        with:
          name: zip-install-archives
          path: ${{ github.workspace }}/zip-install-archives

      - name: Restore Composer's download cache
        id: composer-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.composer/cache
          key: ${{ env.CACHE_KEY_PREFIX }}${{ github.run_id }}
          restore-keys: ${{ env.CACHE_KEY_PREFIX }}

      - name: Let Composer authenticate its GitHub downloads
        env:
          GITHUB_TOKEN_FOR_COMPOSER: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ~/.composer
          (umask 077 && jq -n --arg token "${GITHUB_TOKEN_FOR_COMPOSER}" '{"github-oauth": {"github.com": $token}}' > ~/.composer/auth.json)

      - name: Create the shop
        env:
          SHOPWARE_VERSION: ${{ matrix.shopware_version }}
          PHP_VERSION: ${{ matrix.php_version }}
          PACKAGES_BEFORE: ${{ matrix.packages_before }}
        run: |
          set -euo pipefail
          packages_before_args=()
          if [[ -n "${PACKAGES_BEFORE}" ]]; then
            packages_before_args=(--packages-before "${PACKAGES_BEFORE}")
          fi
          agentic-commerce/bin/ci-create-shop.sh shop "${SHOPWARE_VERSION}" --php-version "${PHP_VERSION}" "${packages_before_args[@]}"

      - name: Install and update the archive
        env:
          PACKAGES: ${{ matrix.packages }}
          SHOPWARE_VERSION: ${{ matrix.shopware_version }}
        run: |
          set -uo pipefail
          plugin_root="${GITHUB_WORKSPACE}/agentic-commerce"
          archives_dir="${GITHUB_WORKSPACE}/zip-install-archives"
          archive_under_test_path="${GITHUB_WORKSPACE}/SwagAgenticCommerce.zip"
          if [[ -f "${archives_dir}/under-test/SwagAgenticCommerce.zip" ]]; then
            archive_under_test_path="${archives_dir}/under-test/SwagAgenticCommerce.zip"
          fi
          test_options=(--shop-url http://127.0.0.1:8000 --exec-user "$(id -u)" --keep)
          if [[ "${PACKAGES}" == "older" ]]; then
            test_options+=(--older-packages)
          fi

          has_failed=0
          scenario_results=()
          run_scenario() {
            local name="$1" exit_code=0 scenario_log failed_checks
            shift
            scenario_log="${RUNNER_TEMP}/zip-install/${name}.log"
            mkdir -p "${RUNNER_TEMP}/zip-install"
            echo "::group::${name}"
            "${plugin_root}/bin/ci-reset-shop.sh" shop || exit_code=3
            if [[ "${exit_code}" -eq 0 ]]; then
              container="$(cd shop && docker compose ps -a -q web)"
              "${plugin_root}/bin/test-zip-install.sh" --zip "${archive_under_test_path}" --container "${container}" "${test_options[@]}" \
                --work-dir "${RUNNER_TEMP}/zip-install/${name}" "$@" 2>&1 | tee "${scenario_log}" || exit_code=$?
            fi
            echo "::endgroup::"
            case "${exit_code}" in
              0) scenario_results+=("| ${name} | passed |") ;;
              3)
                has_failed=1
                scenario_results+=("| ${name} | setup failed, the archive was not exercised |")
                echo "::error title=${name}::The shop or the base archive could not be set up."
                ;;
              *)
                has_failed=1
                failed_checks="$(sed -n 's/^FAIL: //p' "${scenario_log}" | sed 's/|/\\|/g' | awk 'NR > 1 { printf "; " } { printf "%s", $0 }')"
                scenario_results+=("| ${name} | failed: ${failed_checks:-see the log} |")
                echo "::error title=${name}::The archive failed a check."
                ;;
            esac
          }

          run_scenario install
          for base_archive in $(printf '%s\n' "${archives_dir}"/base/*.zip | sort -V); do
            archive_suffix="${base_archive##*/SwagAgenticCommerce-}"
            version="${archive_suffix%.zip}"
            run_scenario "update-from-${version}" --from-zip "${base_archive}"
          done

          {
            echo "### Shopware ${SHOPWARE_VERSION}, ${PACKAGES} packages"
            echo
            echo '| Scenario | Result |'
            echo '| --- | --- |'
            printf '%s\n' "${scenario_results[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${has_failed}"

      - name: Save Composer's download cache
        if: ${{ !cancelled() && steps.composer-cache.outputs.cache-matched-key != format('{0}{1}', env.CACHE_KEY_PREFIX, hashFiles('shop/composer.lock')) }}
        uses: actions/cache/save@v6
        with:
          path: ~/.composer/cache
          key: ${{ env.CACHE_KEY_PREFIX }}${{ hashFiles('shop/composer.lock') }}

      - name: Upload the shop's logs and Composer files
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: zip-install-${{ matrix.line }}-${{ matrix.packages }}
          path: |
            shop/var/log
            ${{ runner.temp }}/zip-install
          if-no-files-found: ignore
          retention-days: 7

      - name: Take the GitHub token off the runner
        if: always()
        run: rm -f ~/.composer/auth.json
