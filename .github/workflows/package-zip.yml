name: Package extension zip

# Builds a downloadable, directly-installable SwagAgenticCommerce archive for
# testing without a local build. Two ways to trigger it:
#   - On a pull request, opt in with the `build:zip` label. Adding the label
#     builds immediately; while it stays on, every push rebuilds.
#   - Manually via "Run workflow" (workflow_dispatch), selecting any branch or
#     tag (for example main).
#
# The artifact is uploaded UNPACKED (the SwagAgenticCommerce/ plugin directory),
# so GitHub's own artifact-download wrapper is the install-ready zip: downloading
# it yields SwagAgenticCommerce.zip containing SwagAgenticCommerce/, which uploads
# straight into Administration -> Extensions -> Upload extension. Uploading the
# built .zip as an artifact instead would double-zip it (GitHub wraps artifacts in
# another zip), and the admin would reject it with
# FRAMEWORK__PLUGIN_NO_PLUGIN_FOUND_IN_ZIP.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      overwrite_version:
        description: 'Plugin version to stamp (Shopware rejects semver pre-release suffixes; use e.g. 1.3.99)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: package-zip-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-zip:
    name: Package extension zip
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build:zip')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # full history so shopware-cli can generate the changelog
          fetch-depth: 0

      - name: Install shopware-cli
        uses: shopware/shopware-cli-action@v3

      - name: Build and validate the extension zip
        run: |
          set -euo pipefail
          version_flag=()
          if [[ -n "${{ github.event.inputs.overwrite_version }}" ]]; then
            version_flag=(--overwrite-version "${{ github.event.inputs.overwrite_version }}")
          fi
          # --disable-git packs the checkout as it stands. Nothing in this job modifies it any
          # more, and bin/ci-assert-zip-no-vendor.sh fails the build if anything strays in.
          shopware-cli extension zip . --disable-git --release "${version_flag[@]}"
          shopware-cli extension validate SwagAgenticCommerce.zip

      # `extension validate` does not look at the compiled administration bundle, so it
      # happily passes an archive whose admin assets are empty or self-referencing.
      - name: Assert the zip ships a usable administration bundle
        run: bin/ci-assert-zip-admin-bundle.sh SwagAgenticCommerce.zip

      # `extension validate` does not read the archive's dependency shape, so a build that
      # reintroduced a bundled vendor/ -- and with it a second Composer autoloader in every
      # shop -- would pass it.
      - name: Assert the zip bundles no dependencies
        run: bin/ci-assert-zip-no-vendor.sh SwagAgenticCommerce.zip

      - name: Unpack so the downloaded artifact is directly installable
        run: |
          mkdir -p dist
          unzip -q SwagAgenticCommerce.zip -d dist

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: SwagAgenticCommerce
          path: dist
          include-hidden-files: true

      # The zip-install job below installs this archive on 6.5, 6.6 and trunk. This tells a
      # developer how to repeat it against their own lane, against the downloaded artifact.
      - name: How to verify this archive on a local lane
        run: |
          {
            echo "### Installing this archive on your own lane"
            echo
            echo 'The zip-install job already did this on 6.5.x, 6.6.x and trunk. To repeat it'
            echo 'against a local lane, on a shop that does not already provide the SDK:'
            echo
            echo '```'
            echo 'bin/test-zip-install.sh --zip <downloaded>.zip \'
            echo '  --container shopware-6-5-branch-web-1 \'
            echo '  --shop-url http://sw65.localhost:8088 \'
            echo '  --sync-session agentic-commerce-65'
            echo '```'
            echo
            echo 'It strips the project-level SDK first and refuses to run if the shop can still'
            echo 'resolve it, because that is how the last defect stayed invisible.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Neither the admin-bundle guard nor the SDK guard can prove the archive installs. The SDK was
  # once present, correctly pointed at, and still never loaded, because Shopware does not require
  # a plugin's own vendor/autoload.php -- so both checks passed while `plugin:install` failed on
  # every Shopware version. Only an install onto a shop that does not separately provide the SDK
  # settles it, on each supported line.
  zip-install:
    name: Install the zip (${{ matrix.lane }})
    needs: package-zip
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: ['6.5.x', '6.6.x', 'trunk']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: agentic-commerce
      - name: Check out the lane
        uses: actions/checkout@v6
        with:
          repository: shopware/shopware
          ref: ${{ matrix.lane }}
          path: shopware
      - name: Download the built archive
        uses: actions/download-artifact@v7
        with:
          name: SwagAgenticCommerce
          path: archive
      # The artifact is uploaded unpacked (see the note at the top of this file), so re-zip the
      # plugin directory to get back the single-rooted archive the upload endpoint expects.
      - name: Re-zip the archive
        run: cd archive && zip -qr "$GITHUB_WORKSPACE/SwagAgenticCommerce.zip" SwagAgenticCommerce
      - run: chmod +x agentic-commerce/bin/ci-smoke.sh agentic-commerce/bin/ci-write-compose.sh agentic-commerce/bin/test-zip-install.sh
      - run: agentic-commerce/bin/ci-write-compose.sh "$GITHUB_WORKSPACE/shopware" "${{ matrix.lane }}"
      # CI_SMOKE_SKIP_PLUGIN removes the plugin and both SDK packages from the project before
      # installing it, which is the whole point: on a shop that can resolve the SDK by another
      # route, a green install proves nothing about the archive.
      - name: Boot a shop that has never seen the SDK
        run: agentic-commerce/bin/ci-smoke.sh "$GITHUB_WORKSPACE/shopware"
        env:
          SHOPWARE_REF: ${{ matrix.lane }}
          # SKIP_PLUGIN is only accepted together with BOOTSTRAP_ONLY: a run that installs
          # nothing has no smoke assertions left to make.
          CI_SMOKE_SKIP_PLUGIN: '1'
          CI_SMOKE_BOOTSTRAP_ONLY: '1'
          CI_SMOKE_MODE: cold
          CI_SMOKE_KEEP_STACK: '1'
      - name: Install the archive the way a merchant does
        working-directory: shopware
        run: |
          set -euo pipefail
          container="$(docker compose ps -a -q web)"
          if [[ -z "${container}" ]]; then
            echo "The lane has no web container; the bootstrap step did not leave the stack up." >&2
            exit 1
          fi
          url="$(sed -nE 's/^[[:space:]]*APP_URL:[[:space:]]*(.+)$/\1/p' compose.yaml | head -n 1)"
          "$GITHUB_WORKSPACE/agentic-commerce/bin/test-zip-install.sh" \
            --zip "$GITHUB_WORKSPACE/SwagAgenticCommerce.zip" \
            --container "${container}" \
            --shop-url "${url:-http://localhost:8000}"
