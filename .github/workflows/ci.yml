name: CI

# Orchestrates the layer workflows (php.yml, admin.yml, storefront.yml, acceptance.yml,
# package-zip.yml) and aggregates them in validation-gate, the one check branch protection and
# store-release.yml rely on. Every event runs the full validation: there is no fast path that
# trusts an earlier run, so a green gate always means the work ran on this commit.

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    # labeled: adding run/acceptance-full has to start a run. Any other label change reruns CI
    # too. Skipping the jobs on those runs would post a passing gate over an earlier red one.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: 'ucp-php-sdk ref to test against'
        default: 'main'
        required: true
      shopware_65_ref:
        description: 'Shopware 6.5 ref'
        default: '6.5.x'
        required: true
      shopware_66_ref:
        description: 'Shopware 6.6 ref'
        default: '6.6.x'
        required: true
      shopware_trunk_ref:
        description: 'Shopware trunk/6.7 ref'
        default: 'trunk'
        required: true

permissions:
  contents: read

concurrency:
  # Only a pull request's superseded runs cancel each other. Every other run gets its own group, so
  # a main push, a tag push or a dispatch on the same commit never cancels the run a release reads.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: ShellCheck bin scripts
        run: shellcheck -x bin/*.sh bin/lib/*.sh

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Prettier owns the shape -- 100 columns, wrapped prose, one style across every markdown
      # file. The changelogs keep one line per entry (see .prettierrc.json).
      - name: Markdown formatting
        run: npm run lint:md
      - name: Markdown links
        run: bin/ci-assert-markdown-links.sh
      - name: Changelog parity
        run: bin/ci-assert-changelog-parity.sh

  # A job only blocks a merge if a gate needs it. This proves, for every gated workflow, that no
  # job was added without its gate noticing.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Every job is aggregated by its workflow's gate
        run: bin/ci-assert-gate-coverage.sh .github/workflows/*.yml
      - name: Coverage floor checker tests
        run: python3 -I -m unittest discover -s tests/ci

  php:
    uses: ./.github/workflows/php.yml
    with:
      sdk_ref: ${{ inputs.sdk_ref }}
      shopware_65_ref: ${{ inputs.shopware_65_ref }}
      shopware_66_ref: ${{ inputs.shopware_66_ref }}
      shopware_trunk_ref: ${{ inputs.shopware_trunk_ref }}

  admin:
    uses: ./.github/workflows/admin.yml
    with:
      shopware_65_ref: ${{ inputs.shopware_65_ref }}
      shopware_66_ref: ${{ inputs.shopware_66_ref }}
      shopware_trunk_ref: ${{ inputs.shopware_trunk_ref }}

  storefront:
    uses: ./.github/workflows/storefront.yml
    with:
      shopware_65_ref: ${{ inputs.shopware_65_ref }}
      shopware_66_ref: ${{ inputs.shopware_66_ref }}
      shopware_trunk_ref: ${{ inputs.shopware_trunk_ref }}

  # Builds the archive the way a Store release does, installs it on 6.5, 6.6 and trunk, and leaves
  # it as the run's downloadable SwagAgenticCommerce artifact. A pull request build carries its PR
  # number in the extension label, so an installed copy never passes for the release.
  zip-artifact:
    permissions:
      contents: read
    uses: ./.github/workflows/package-zip.yml
    with:
      label_stamp: ${{ github.event_name == 'pull_request' && 'pull-request' || 'none' }}

  acceptance:
    uses: ./.github/workflows/acceptance.yml
    with:
      lanes: '["trunk"]'
      run_changed: true
      shopware_65_ref: ${{ inputs.shopware_65_ref }}
      shopware_66_ref: ${{ inputs.shopware_66_ref }}
      shopware_trunk_ref: ${{ inputs.shopware_trunk_ref }}

  # The 6.5 and 6.6 acceptance lanes. A pull request opts in with the run/acceptance-full label;
  # every push and dispatch runs them, so main and a release candidate are validated on all lanes.
  acceptance-full:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run/acceptance-full')
    uses: ./.github/workflows/acceptance.yml
    with:
      lanes: '["6.5.x", "6.6.x"]'
      skip_static: true
      shopware_65_ref: ${{ inputs.shopware_65_ref }}
      shopware_66_ref: ${{ inputs.shopware_66_ref }}
      shopware_trunk_ref: ${{ inputs.shopware_trunk_ref }}

  # One report for the run: merges the blobs of both acceptance calls.
  acceptance-report:
    needs:
      - acceptance
      - acceptance-full
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/acceptance-report

  # One line-coverage figure per suite against .github/coverage-floor.json and, on a pull request,
  # the coverage of the lines it changes. The reports come from this run's php-quality (php-8.2) and
  # admin-static jobs. A missing report fails the download, so a skipped producer cannot pass here.
  coverage:
    needs:
      - php
      - admin
    if: ${{ !cancelled() }}
    # Not ubuntu-latest: .github/diff-cover-requirements.txt pins the CPython 3.12 wheels this image ships.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # On a pull request HEAD is the merge commit, so HEAD^1 is the base branch.
          fetch-depth: 2
      - uses: actions/download-artifact@v7
        with:
          name: php-unit-coverage
          path: ${{ runner.temp }}/coverage/php
      - uses: actions/download-artifact@v7
        with:
          name: admin-jest-coverage
          path: ${{ runner.temp }}/coverage/admin
      - name: Coverage floor
        run: >-
          python3 -I bin/ci-coverage-floor.py check .github/coverage-floor.json
          "php=${RUNNER_TEMP}/coverage/php/clover.xml"
          "admin=${RUNNER_TEMP}/coverage/admin/cobertura-coverage.xml"
          --measurement "${RUNNER_TEMP}/measurement.json"
      # Read by coverage-floor.yml, which raises the floors after consecutive runs on main.
      - name: Upload the measurement
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-measurement
          path: ${{ runner.temp }}/measurement.json
          if-no-files-found: error
          retention-days: 90
      - name: Install diff-cover
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          python3 -m venv "${RUNNER_TEMP}/diff-cover"
          "${RUNNER_TEMP}/diff-cover/bin/pip" install --require-hashes --no-deps --only-binary=:all: \
            -r .github/diff-cover-requirements.txt
          echo "${RUNNER_TEMP}/diff-cover/bin" >>"${GITHUB_PATH}"
      - name: Patch coverage
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          status=0
          bin/ci-patch-coverage.sh HEAD^1 "${RUNNER_TEMP}/coverage/php/clover.xml" \
            "${RUNNER_TEMP}/coverage/admin/cobertura-coverage.xml" "${RUNNER_TEMP}/patch/patch.md" || status=$?
          cat "${RUNNER_TEMP}/patch/patch.md" >>"${GITHUB_STEP_SUMMARY}" || true
          exit "${status}"
      - name: Upload patch.md
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v6
        with:
          name: patch-coverage
          path: ${{ runner.temp }}/patch/patch.md
          if-no-files-found: warn
          retention-days: 7

  validation-gate:
    # store-release.yml requires this job, by this name, in a push run on main. A manual run reports
    # as dispatch-gate, so it never posts a validation-gate check on a pull request's head.
    name: ${{ github.event_name == 'workflow_dispatch' && 'dispatch-gate' || 'validation-gate' }}
    # always(), not !cancelled(): a skipped gate would count as passing.
    if: always()
    needs:
      - shell-lint
      - docs-lint
      - workflow-lint
      - php
      - admin
      - storefront
      - zip-artifact
      - acceptance
      - acceptance-full
      - acceptance-report
      - coverage
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # acceptance-full may be skipped only on a pull request without the label.
          allowed-skips: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'run/acceptance-full') && '["acceptance-full"]' || '[]' }}