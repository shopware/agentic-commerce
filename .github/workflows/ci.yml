name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: 'ucp-php-sdk ref to test against'
        default: 'main'
        required: true
      shopware_65_ref:
        description: 'Shopware 6.5 ref'
        default: '6.5.x'
        required: true
      shopware_66_ref:
        description: 'Shopware 6.6 ref'
        default: '6.6.x'
        required: true
      shopware_trunk_ref:
        description: 'Shopware trunk/6.7 ref'
        default: 'trunk'
        required: true
      run_full_matrix:
        description: 'Run the full validation matrix even when no pull request requires it'
        default: false
        required: false
        type: boolean

env:
  # Compatibility lanes intentionally exercise Shopware versions with known
  # advisories. Keep dependency resolution running, then report advisories
  # without making them the test result. Composer 2.9 uses the first variable;
  # newer Composer versions use the policy variable.
  COMPOSER_NO_SECURITY_BLOCKING: '1'
  COMPOSER_POLICY_ADVISORIES_BLOCK: '0'
  UCP_SDK_REF: ${{ github.event.inputs.sdk_ref || vars.UCP_SDK_REF || 'main' }}
  SHOPWARE_65_REF: ${{ github.event.inputs.shopware_65_ref || vars.SHOPWARE_65_REF || '6.5.x' }}
  SHOPWARE_66_REF: ${{ github.event.inputs.shopware_66_ref || vars.SHOPWARE_66_REF || '6.6.x' }}
  SHOPWARE_TRUNK_REF: ${{ github.event.inputs.shopware_trunk_ref || vars.SHOPWARE_TRUNK_REF || 'trunk' }}

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: ShellCheck bin scripts
        run: shellcheck -x bin/*.sh bin/lib/*.sh

  verify-main-validation:
    runs-on: ubuntu-latest
    outputs:
      run_full_matrix: ${{ steps.decide.outputs.run_full_matrix }}
      reason: ${{ steps.decide.outputs.reason }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      pr_url: ${{ steps.decide.outputs.pr_url }}
      pr_head_sha: ${{ steps.decide.outputs.pr_head_sha }}
      pr_merge_commit_sha: ${{ steps.decide.outputs.pr_merge_commit_sha }}
      checked_at: ${{ steps.decide.outputs.checked_at }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_FULL_MATRIX_INPUT: ${{ github.event.inputs.run_full_matrix || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          emit() {
            echo "run_full_matrix=$1" >> "$GITHUB_OUTPUT"
            echo "reason=$2" >> "$GITHUB_OUTPUT"
            echo "pr_number=${3:-}" >> "$GITHUB_OUTPUT"
            echo "pr_url=${4:-}" >> "$GITHUB_OUTPUT"
            echo "pr_head_sha=${5:-}" >> "$GITHUB_OUTPUT"
            echo "pr_merge_commit_sha=${6:-}" >> "$GITHUB_OUTPUT"
            echo "checked_at=${checked_at}" >> "$GITHUB_OUTPUT"
            echo "Validation decision: run_full_matrix=$1 reason=$2"
          }

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            emit true pull_request
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${RUN_FULL_MATRIX_INPUT}" == "true" ]]; then
              emit true workflow_dispatch_requested
            else
              emit false workflow_dispatch_fast_path
            fi
            exit 0
          fi

          if [[ "${EVENT_NAME}" != "push" || "${REF_NAME}" != "main" ]]; then
            emit true unsupported_event
            exit 0
          fi

          pulls_json="$(gh api -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" 2>/tmp/commit-pulls.err || true)"

          if [[ -z "${pulls_json}" ]] || ! jq -e type >/dev/null 2>&1 <<<"${pulls_json}"; then
            emit true commit_pr_lookup_failed
            exit 0
          fi

          pr_json="$(jq -c '[.[] | select(.merged_at != null and .base.ref == "main")] | sort_by(.merged_at) | last // empty' <<<"${pulls_json}")"

          if [[ -z "${pr_json}" ]]; then
            emit true no_merged_pr_for_main_commit
            exit 0
          fi

          pr_number="$(jq -r '.number' <<<"${pr_json}")"
          pr_url="$(jq -r '.html_url' <<<"${pr_json}")"
          pr_head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          pr_merge_commit_sha="$(jq -r '.merge_commit_sha // ""' <<<"${pr_json}")"

          checks_file="$(mktemp)"
          if ! gh pr checks "${pr_number}" --repo "${GITHUB_REPOSITORY}" --json name,state,bucket,workflow >"${checks_file}" 2>/tmp/pr-checks.err; then
            emit true pr_checks_lookup_failed "${pr_number}" "${pr_url}" "${pr_head_sha}" "${pr_merge_commit_sha}"
            exit 0
          fi

          expected_checks=(
            "shell-lint"
            "admin-static"
            "php-quality (php-8.1)"
            "php-quality (php-8.2)"
            "php-quality (6.7.11)"
            "php-quality (6.7.12)"
            "shopware-matrix (6.5.x)"
            "shopware-matrix (6.6.x)"
            "shopware-matrix (trunk)"
            "mysql84-install"
            "admin-matrix (6.5.x, webpack)"
            "admin-matrix (6.6.x, webpack)"
            "admin-matrix (6.6.x, vite)"
            "admin-matrix (trunk, vite)"
            "storefront-matrix (6.5.x)"
            "storefront-matrix (6.6.x)"
            "storefront-matrix (trunk)"
          )

          for check_name in "${expected_checks[@]}"; do
            states="$(jq -r --arg name "${check_name}" '[.[] | select(.name == $name) | .state] | unique | join(",")' "${checks_file}")"

            if [[ -z "${states}" ]]; then
              emit true "missing_check:${check_name}" "${pr_number}" "${pr_url}" "${pr_head_sha}" "${pr_merge_commit_sha}"
              exit 0
            fi

            if [[ "${states}" != "SUCCESS" ]]; then
              emit true "non_success_check:${check_name}:${states}" "${pr_number}" "${pr_url}" "${pr_head_sha}" "${pr_merge_commit_sha}"
              exit 0
            fi
          done

          emit false trusted_pr_checks_success "${pr_number}" "${pr_url}" "${pr_head_sha}" "${pr_merge_commit_sha}"

  php-quality:
    runs-on: ubuntu-latest
    name: php-quality (${{ matrix.lane }})
    needs:
      - verify-main-validation
    if: needs.verify-main-validation.outputs.run_full_matrix == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: 'php-8.1'
            php-version: '8.1'
          - lane: 'php-8.2'
            php-version: '8.2'
          # 6.7.11.x: core still ships Defaults::SALES_CHANNEL_TYPE_AGENTIC_COMMERCE here
          # (present only in 6.7.10-6.7.11), so this lane keeps exercising the "core owns the
          # feature" coexistence path. Moving branch ref -> always the latest 6.7.11 patch.
          - lane: '6.7.11'
            php-version: '8.2'
            shopware-ref: '6.7.11.x'
          # 6.7.12.x: core removed that constant and handed the feature back to the plugin, so
          # this lane proves the "plugin re-owns the feature" path on the 6.7 framework. Moving
          # branch ref -> always the latest 6.7.12 patch.
          - lane: '6.7.12'
            php-version: '8.2'
            shopware-ref: '6.7.12.x'
    steps:
      - uses: actions/checkout@v6
        with:
          path: agentic-commerce
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - uses: actions/checkout@v6
        with:
          repository: agentic-commerce-alliance/ucp-php-sdk
          ref: ${{ env.UCP_SDK_REF }}
          path: ucp-php-sdk
      - uses: actions/checkout@v6
        with:
          repository: shopware/shopware
          ref: ${{ matrix.shopware-ref || matrix.php-version == '8.1' && env.SHOPWARE_65_REF || env.SHOPWARE_66_REF }}
          path: shopware
      - run: composer install --no-dev --no-scripts --no-interaction --prefer-dist
        working-directory: shopware
      - name: Configure private SDK path repositories
        run: |
          composer config repositories.ucp-sdk-core '{"type":"path","url":"../ucp-php-sdk/packages/core","options":{"symlink":false,"versions":{"ucp-php-sdk/core":"0.0.2"}}}'
          composer config repositories.ucp-sdk-symfony '{"type":"path","url":"../ucp-php-sdk/packages/symfony-bundle","options":{"symlink":false,"versions":{"ucp-php-sdk/symfony-bundle":"0.0.2"}}}'
        working-directory: agentic-commerce
      - run: composer install --no-interaction --prefer-dist
        working-directory: agentic-commerce
      - name: Capture plugin Composer advisory report
        if: matrix.lane == 'php-8.2'
        working-directory: agentic-commerce
        run: |
          audit_file="${GITHUB_WORKSPACE}/composer-audit-plugin.json"
          audit_status=0

          if composer audit --no-dev --format=json > "${audit_file}"; then
            audit_status=0
          else
            audit_status=$?
          fi

          if [[ ! -s "${audit_file}" ]]; then
            if [[ "${audit_status}" -eq 0 ]]; then
              printf '{"advisories":{},"abandoned":[]}\n' > "${audit_file}"
            else
              printf '{"error":"composer audit produced no JSON","exitCode":%d}\n' "${audit_status}" > "${audit_file}"
            fi
          fi

          echo "Composer audit report written to ${audit_file} (exit ${audit_status})."
      - name: Upload plugin Composer advisory report
        if: always() && matrix.lane == 'php-8.2'
        uses: actions/upload-artifact@v4
        with:
          name: composer-audit-plugin
          path: composer-audit-plugin.json
          if-no-files-found: ignore
          retention-days: 7
      - run: chmod +x agentic-commerce/bin/ci-smoke.sh
      - run: composer ci
        working-directory: agentic-commerce
        env:
          SHOPWARE_PROJECT_DIR: ${{ github.workspace }}/shopware

  admin-static:
    runs-on: ubuntu-latest
    needs:
      - verify-main-validation
    if: needs.verify-main-validation.outputs.run_full_matrix == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          path: agentic-commerce
      - uses: actions/checkout@v6
        with:
          repository: shopware/shopware
          ref: ${{ env.SHOPWARE_TRUNK_REF }}
          path: shopware
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agentic-commerce/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: agentic-commerce
      - run: npm run ci:admin-static
        working-directory: agentic-commerce
        env:
          ADMIN_PATH: ${{ github.workspace }}/shopware/src/Administration/Resources/app/administration

  shopware-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - verify-main-validation
    if: needs.verify-main-validation.outputs.run_full_matrix == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: '6.5.x'
          - lane: '6.6.x'
          - lane: 'trunk'
    steps:
      - uses: actions/checkout@v6
        with:
          path: agentic-commerce
      - uses: actions/checkout@v6
        with:
          repository: shopware/shopware
          ref: ${{ matrix.lane == '6.5.x' && env.SHOPWARE_65_REF || matrix.lane == '6.6.x' && env.SHOPWARE_66_REF || env.SHOPWARE_TRUNK_REF }}
          path: shopware
      - uses: actions/checkout@v6
        with:
          repository: agentic-commerce-alliance/ucp-php-sdk
          ref: ${{ env.UCP_SDK_REF }}
          path: ucp-php-sdk
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agentic-commerce/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: agentic-commerce
      - run: chmod +x agentic-commerce/bin/ci-smoke.sh agentic-commerce/bin/ci-write-compose.sh
      - run: agentic-commerce/bin/ci-write-compose.sh "$GITHUB_WORKSPACE/shopware" "${{ matrix.lane }}"
      - run: agentic-commerce/bin/ci-smoke.sh "$GITHUB_WORKSPACE/shopware"
        env:
          SDK_ROOT: ${{ github.workspace }}/ucp-php-sdk
          SHOPWARE_REF: ${{ matrix.lane }}
          # Run the functional suite on every shopware-matrix lane. ci-smoke installs
          # Shopware's dev deps so the suite runs on the lane's own phpunit
          # (6.5->9.x, 6.6->10.x, trunk->11.x; Shopware's test base classes are coupled
          # to the phpunit major), covering lane-specific behavior everywhere the smoke runs.
          CI_SMOKE_RUN_FUNCTIONAL: '1'
          CI_COMPOSER_AUDIT_OUTPUT: ${{ github.workspace }}/composer-audit.json
      - name: Upload Composer advisory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composer-audit-${{ matrix.lane }}
          path: composer-audit.json
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run test:e2e:ucp -- --reporter=list
        working-directory: agentic-commerce
        env:
          BASE_URL: http://localhost:8000
          SHOPWARE_REF: ${{ matrix.lane }}

  composer-security-report:
    name: composer-security-report
    runs-on: ubuntu-latest
    needs:
      - verify-main-validation
      - php-quality
      - shopware-matrix
    if: always() && needs.verify-main-validation.outputs.run_full_matrix == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          path: agentic-commerce
      - name: Download Composer advisory reports
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: composer-audit-*
          path: composer-audits
      - name: Summarize Composer security advisories
        continue-on-error: true
        run: bash agentic-commerce/bin/ci-composer-audit-report.sh composer-audits

  mysql84-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - verify-main-validation
    if: needs.verify-main-validation.outputs.run_full_matrix == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          path: agentic-commerce
      - uses: actions/checkout@v6
        with:
          repository: shopware/shopware
          ref: ${{ env.SHOPWARE_TRUNK_REF }}
          path: shopware
      - uses: actions/checkout@v6
        with:
          repository: agentic-commerce-alliance/ucp-php-sdk
          ref: ${{ env.UCP_SDK_REF }}
          path: ucp-php-sdk
      - run: chmod +x agentic-commerce/bin/ci-smoke.sh agentic-commerce/bin/ci-write-compose.sh
      # Provision the stack on MySQL 8.4 (not the default MariaDB) and run the
      # plugin install/migrations only. MySQL 8.4 rejects a foreign key that
      # references a prefix of a composite key, so this lane catches migration
      # regressions like the order (id, version_id) FK that MariaDB accepts.
      - run: agentic-commerce/bin/ci-write-compose.sh "$GITHUB_WORKSPACE/shopware" trunk
        env:
          CI_DB_FLAVOR: mysql84
      - run: agentic-commerce/bin/ci-smoke.sh "$GITHUB_WORKSPACE/shopware"
        env:
          SDK_ROOT: ${{ github.workspace }}/ucp-php-sdk
          SHOPWARE_REF: trunk
          CI_DB_FLAVOR: mysql84
          CI_SMOKE_BOOTSTRAP_ONLY: '1'

  admin-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - verify-main-validation
    if: needs.verify-main-validation.outputs.run_full_matrix == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: '6.5.x'
            mode: webpack
          - lane: '6.6.x'
            mode: webpack
          - lane: '6.6.x'
            mode: vite
          - lane: 'trunk'
            mode: vite
    steps:
      - uses: actions/checkout@v6
        with:
          path: agentic-commerce
      - uses: actions/checkout@v6
        with:
          repository: shopware/shopware
          ref: ${{ matrix.lane == '6.5.x' && env.SHOPWARE_65_REF || matrix.lane == '6.6.x' && env.SHOPWARE_66_REF || env.SHOPWARE_TRUNK_REF }}
          path: shopware
      - uses: actions/checkout@v6
        with:
          repository: agentic-commerce-alliance/ucp-php-sdk
          ref: ${{ env.UCP_SDK_REF }}
          path: ucp-php-sdk
      - run: npm ci --no-audit --no-fund
        working-directory: agentic-commerce
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('agentic-commerce/package-lock.json') }}
      - name: Install Playwright browser + system deps (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
        working-directory: agentic-commerce
      - name: Install Playwright system deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: agentic-commerce
      - run: chmod +x agentic-commerce/bin/ci-smoke.sh agentic-commerce/bin/ci-admin-smoke.sh agentic-commerce/bin/ci-write-compose.sh
      - run: agentic-commerce/bin/ci-write-compose.sh "$GITHUB_WORKSPACE/shopware" "${{ matrix.lane }}"
      - run: agentic-commerce/bin/ci-admin-smoke.sh "$GITHUB_WORKSPACE/shopware" "${{ matrix.mode }}"
        env:
          SDK_ROOT: ${{ github.workspace }}/ucp-php-sdk
          SHOPWARE_REF: ${{ matrix.lane }}
          CI_ADMIN_BOOTSTRAP_MODE: cold
          CI_ADMIN_BROWSER_VALIDATE: 1
          CI_ADMIN_KEEP_STACK: 0

  storefront-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - verify-main-validation
    if: needs.verify-main-validation.outputs.run_full_matrix == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: '6.5.x'
          - lane: '6.6.x'
          - lane: 'trunk'
    steps:
      - uses: actions/checkout@v6
        with:
          path: agentic-commerce
      - uses: actions/checkout@v6
        with:
          repository: shopware/shopware
          ref: ${{ matrix.lane == '6.5.x' && env.SHOPWARE_65_REF || matrix.lane == '6.6.x' && env.SHOPWARE_66_REF || env.SHOPWARE_TRUNK_REF }}
          path: shopware
      - uses: actions/checkout@v6
        with:
          repository: agentic-commerce-alliance/ucp-php-sdk
          ref: ${{ env.UCP_SDK_REF }}
          path: ucp-php-sdk
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agentic-commerce/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: agentic-commerce
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('agentic-commerce/package-lock.json') }}
      - name: Install Playwright browser + system deps (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
        working-directory: agentic-commerce
      - name: Install Playwright system deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: agentic-commerce
      - run: chmod +x agentic-commerce/bin/ci-smoke.sh agentic-commerce/bin/ci-storefront-smoke.sh agentic-commerce/bin/ci-write-compose.sh
      - run: agentic-commerce/bin/ci-write-compose.sh "$GITHUB_WORKSPACE/shopware" "${{ matrix.lane }}"
      - run: agentic-commerce/bin/ci-storefront-smoke.sh "$GITHUB_WORKSPACE/shopware"
        env:
          SDK_ROOT: ${{ github.workspace }}/ucp-php-sdk
          SHOPWARE_REF: ${{ matrix.lane }}
          CI_STOREFRONT_BOOTSTRAP_MODE: cold
          CI_STOREFRONT_KEEP_STACK: 0

  validation-gate:
    name: validation-gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - verify-main-validation
      - shell-lint
      - php-quality
      - admin-static
      - shopware-matrix
      - mysql84-install
      - admin-matrix
      - storefront-matrix
    steps:
      - name: Require complete validation
        env:
          RUN_FULL_MATRIX: ${{ needs.verify-main-validation.outputs.run_full_matrix }}
          VERIFY_RESULT: ${{ needs.verify-main-validation.result }}
          SHELL_RESULT: ${{ needs.shell-lint.result }}
          PHP_RESULT: ${{ needs.php-quality.result }}
          ADMIN_STATIC_RESULT: ${{ needs.admin-static.result }}
          SHOPWARE_RESULT: ${{ needs.shopware-matrix.result }}
          MYSQL84_RESULT: ${{ needs.mysql84-install.result }}
          ADMIN_RESULT: ${{ needs.admin-matrix.result }}
          STOREFRONT_RESULT: ${{ needs.storefront-matrix.result }}
        run: |
          set -euo pipefail

          if [[ "${VERIFY_RESULT}" != "success" || "${SHELL_RESULT}" != "success" ]]; then
            echo "Validation setup or shell lint failed." >&2
            exit 1
          fi

          if [[ "${RUN_FULL_MATRIX}" == "false" ]]; then
            echo "The exact merged PR checks were already verified."
            exit 0
          fi

          if [[ "${RUN_FULL_MATRIX}" != "true" ]]; then
            echo "Unable to determine whether the full validation matrix was required." >&2
            exit 1
          fi

          for result in \
            "${PHP_RESULT}" \
            "${ADMIN_STATIC_RESULT}" \
            "${SHOPWARE_RESULT}" \
            "${MYSQL84_RESULT}" \
            "${ADMIN_RESULT}" \
            "${STOREFRONT_RESULT}"
          do
            if [[ "${result}" != "success" ]]; then
              echo "A required validation job did not succeed: ${result}" >&2
              exit 1
            fi
          done

          echo "All required validation jobs succeeded."
