version: 2
updates:
  # Workflows and the composite actions in .github/actions/*. All references are major tags, so
  # every update here is a major. One group keeps upload/download-artifact pairs in lockstep.
  # store-release.yml and coverage-floor.yml are not exercised by PR CI: verify them after merge.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  # Root QA tooling, devDependencies only.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      # Families that must move together across majors. No update-types, and listed before the
      # catch-all, so they win under both first-match and pattern specificity.
      lint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint", "@typescript-eslint/*", "globals"]
      jest:
        patterns: ["jest", "jest-environment-jsdom", "@types/jest"]
      minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
      security:
        applies-to: "security-updates"
        patterns: ["*"]

  # Acceptance suite: separate install and lockfile.
  - package-ecosystem: "npm"
    directory: "/tests/acceptance"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    # Replaces the default labels. These manifests are not lane-sensitive in ci.yml, so
    # run/acceptance-full is what runs the 6.5.x, 6.6.x and 6.7.14.x lanes.
    labels:
      - "dependencies"
      - "run/acceptance-full"
    cooldown:
      default-days: 7
    groups:
      # @playwright/test and playwright-core must be identical; the suite package declares them as peers.
      playwright:
        patterns: ["@shopware-ag/acceptance-test-suite", "@playwright/test", "playwright-core"]
      lint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "@stylistic/*", "typescript-eslint", "globals", "jiti"]
      minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
      security:
        applies-to: "security-updates"
        patterns: ["*"]

  # No composer.lock: only constraints move, so in practice only majors of dev tools.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # rector 2.x requires phpstan ^2.
      phpstan-rector:
        patterns: ["phpstan/*", "rector/rector"]
    # Name-only ignores apply to version updates. They do not block security updates.
    ignore:
      # The range is the supported-version matrix; only a deliberate change may move it.
      - dependency-name: "shopware/core"
      # Exact pin, moved only with a plugin release (CONTRIBUTING.md, SDK version pin).
      - dependency-name: "ucp-php-sdk/*"
      # PHPUnit 11+ requires PHP 8.2; php-quality still tests PHP 8.1.
      - dependency-name: "phpunit/phpunit"
        update-types: ["version-update:semver-major"]