ucp_sdk:
    version: '2026-04-08'
    signature_policy: strict
    idempotency_required: true
    signing_keys:
        auto_generate: true
        default_kid: 'default'
        algorithm: 'ES256'
        retire_after: 'P30D'
        retired_key_retention: 'P30D'
    storage:
        dsn: 'sqlite:///%kernel.project_dir%/var/swag_agentic_commerce_ucp.sqlite'
