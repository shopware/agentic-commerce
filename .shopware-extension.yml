compatibility_date: 2026-06-05
build:
  # This is the asset-build lane, not the plugin's runtime compatibility range.
  # Vite output plus the legacy loader below is shared by all supported lanes.
  shopwareVersionConstraint: ">=6.7.0 <6.8.0"
  zip:
    composer:
      enabled: true
    assets:
      enabled: true
      after_hooks:
        - mkdir -p src/Resources/public/administration/js && cp src/Resources/app/administration/src/public/js/swag-agentic-commerce.js src/Resources/public/administration/js/swag-agentic-commerce.js
    pack:
      excludes:
        paths:
          - bin
          - docs
          - eslint.config.mjs
          - package.json
          - package-lock.json
          - playwright.config.js
